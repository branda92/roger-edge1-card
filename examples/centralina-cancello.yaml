# Sostituisci INSERISCI_ID_DISPOSITIVO con l’ID del tuo dispositivo ESPHome.
# Cerca le entità nel registro HA usando i nomi originali ESPHome:
# funziona anche se hai già rinominato i rispettivi entity_id.
type: custom:roger-edge1-card
device_id: INSERISCI_ID_DISPOSITIVO
# Convenzione grafica; scambia in "right" se l'anta 1 è a destra.
motor1_side: left
# Opzionale: adatta la posizione al tuo cancello o rimuovi questo blocco.
pedestrian_position:
  motor: 1
  position: 40
  tolerance: 1
settings_action: device_page
ui:
  view_mode: hybrid
  header:
    enabled: true
    title: Centralina Cancello
    show_state: false
    show_position: false
    settings_button_position: header
  controls:
    show_open: true
    show_stop: true
    show_close: true
    show_pedestrian: true
  effects:
    active_action: pulse
